spring.application.name=smart-shop-credit-tracker
server.port=${PORT:8080}
spring.datasource.url=${SHOP_DB_URL:jdbc:mysql://localhost:3306/smart_shop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SHOP_DB_USERNAME:smart_shop_app}
spring.datasource.password=${SHOP_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
shop.bootstrap.username=${SHOP_BOOTSTRAP_USERNAME:admin}
shop.bootstrap.password=${SHOP_BOOTSTRAP_PASSWORD:}
