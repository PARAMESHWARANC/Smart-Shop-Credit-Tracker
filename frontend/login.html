<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Smart Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">SS</div>
    <p class="eyebrow mb-1">SMART SHOP CREDIT TRACKER</p>
    <h1 class="h3 mb-2">Welcome back</h1>
    <p class="text-secondary mb-4">Sign in to manage customers and shop accounts.</p>
    <div id="login-alert" class="alert d-none" role="alert"></div>
    <form id="login-form">
      <label class="form-label" for="username">Username</label>
      <input class="form-control mb-3" id="username" name="username" autocomplete="username" required>
      <label class="form-label" for="password">Password</label>
      <input class="form-control mb-4" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
    <p class="small text-secondary mt-4 mb-0">Local academic project · Staff access only</p>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
